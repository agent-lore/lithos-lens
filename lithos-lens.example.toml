# Lithos Lens configuration.
# Copy to lithos-lens.toml (cwd), ~/.lithos-lens/lithos-lens.toml, or
# /etc/lithos-lens/lithos-lens.toml and adjust to taste. Alternatively point
# LITHOS_LENS_CONFIG at this file.

[lithos-lens]
environment = "dev"
greeting = "Hello"

[lithos-lens.ui]
default_view = "tasks"

[lithos-lens.storage]
data_dir = "~/.lithos-lens/data"

[lithos-lens.logging]
level = "info"   # one of: debug, info, warning, error

[lithos-lens.lithos]
url = "http://localhost:8765"
mcp_sse_path = "/sse"
sse_events_path = "/events"
agent_id = "lithos-lens"

[lithos-lens.tasks]
auto_refresh_interval_s = 120
frontier_limit = 500   # cap pushed to the lithos ready/blocked frontier reads
default_time_range_days = 30    # resolved-at window for the completed/cancelled sections (1-365)
# How much of a task description a BOARD row shows (dashboard rows, gate rows
# and the side panel). Descriptions render as markdown everywhere; a row takes
# whole leading blocks up to this budget and links on with "see more". The
# detail page that link leads to never truncates. 0 = never truncate anywhere.
description_preview_chars = 600
# Needs-attention thresholds (rules 3-6; unsatisfiable blockers and cycles are
# intrinsic and always flagged).
gate_waiting_attention_hours = 24   # human gate waiting on a person
claim_expiring_soon_minutes = 10    # claim about to lapse (expired claims are unobservable)
stale_open_age_days = 7             # workable open task nobody resolved
unclaimed_ready_age_minutes = 60    # ready frontier row the fleet has not picked up
# The Agent filter picker's window: a registration with no task, no claim and no
# registration touch inside it is left out of the datalist by default, because
# lithos_agent_list is a registration log (a row per probe, per session, per
# host) and the dead ones crowd out the live identities. ?all_agents=1 shows
# every registration; nothing is ever unfilterable by typing its id.
agent_inactive_days = 30
# Rule 6's SCOPE: only ready tasks carrying a tag with one of these prefixes are
# work a fleet was expected to pick up (loom dispatches on `trigger:...`).
# Untagged ready work waits for a human to schedule it, so its age says nothing
# about a stalled fleet and it stays in Ready. Set [] to judge every ready task
# (the pre-2026-09 behaviour).
dispatch_trigger_tag_prefixes = ["trigger:"]
default_status_groups = ["open", "completed", "cancelled"]
# ?project= matches a row under EITHER convention — metadata.project or the
# project:<slug> tag (REQUIREMENTS §5B.1) — so there is no posture to set. The
# old project_convention knob is parsed and ignored (§4.4); remove it.
project_tag_key = "project"   # tag key reserved for the tag convention

[lithos-lens.graph]
# Task dependency graph pages (REQUIREMENTS §5.7). There is no bulk graph fetch
# upstream, so a page assembles its edges with one lithos_task_edge_list call
# per node, shared through a per-task cache.
cache_ttl_s = 30            # per-task edge cache TTL; task events evict, lens.refresh flushes
max_tasks = 300             # page-scope size guard, ghosts counted (1-2000); above it the page is refused
fetch_concurrency = 16      # semaphore over the per-task edge_list fan-out (1-64)
mini_graph_max_nodes = 40   # detail mini-graph cap, the focal task included

[lithos-lens.writes]
# Curated write actions (REQUIREMENTS §5C). There is NO `enabled` key and no
# read-only mode: the actions are part of the product, and what decides whether
# an affordance renders is the task's state and whether an operator identity
# resolves. Lens has no authentication — the boundary is the trusted network,
# and the operator page (/operator) states it.
#
# The identity a browser with no `lens_operator` cookie acts under. Empty means
# "none", and every write affordance is then replaced by a "choose an operator
# to act" link. Lowercase slug (^[a-z0-9][a-z0-9-]{0,62}$), validated at load
# exactly like the cookie; set it on a single-operator install so nobody is
# prompted. Writes are never attributed to the Lens service agent above.
default_operator = ""
# Keep the consequence-aware confirm page in front of a cancel; false puts the
# same facts on the receipt instead.
confirm_cancel = true

[lithos-lens.knowledge]
related_title_fanout_cap = 20   # cap on lithos_read title lookups per related panel (1-100)
search_limit = 20               # /knowledge?q= hybrid-search result cards (1-200)
recent_limit = 20               # /knowledge "Your notes" and "Recent intake" section length (1-200)
list_chip_fanout_cap = 40       # /knowledge rows given metadata chips, one lithos_read each (1-200)
# Paths that make a note intake on /knowledge (as does an ingested-by:* tag);
# [] leaves only the tag.
intake_path_prefixes = ["articles/", "papers/", "digests/"]
tags_page_limit = 500           # /knowledge/tags rows before "N more — narrow the filter" (1-5000)
graph_edge_table_ttl_s = 300    # knowledge graph edge-table snapshot staleness bound, seconds (1-3600)
graph_edge_table_max_edges = 50000  # edge table refused above this; filtered reads only (1-500000)
graph_focus_max_nodes = 250     # focus graph refused above this many notes, naming a remedy (1-2000)
graph_default_depth = 1         # hops of typed edges a focus graph opens at (1-2)
graph_note_facts_ttl_s = 3600   # graph node facts (title, type, status, lede…) cache TTL, seconds (1-86400)
graph_title_fanout_cap = 300    # lithos_read calls per graph render for node facts (1-2000)

[lithos-lens.events]
enabled = true
reconnect_backoff_ms = [500, 1000, 2000, 5000, 10000]

[lithos-lens.llm]
enabled = false
provider = ""
model = ""
api_key = ""
base_url = ""
extra_headers_json = ""
max_tokens = 2048

[lithos-lens.telemetry]
# The OpenTelemetry packages are REQUIRED dependencies, so `enabled` is on by
# default and governs EXPORT, not whether the instrumentation exists. With no
# endpoint and no console fallback, spans are created and dropped -- which
# still puts trace_id on every log line. Set false to install no providers.
enabled = true
# Base OTLP/HTTP collector URL; /v1/traces, /v1/metrics and /v1/logs are
# derived from it. Empty falls back to the standard OTEL_EXPORTER_OTLP_ENDPOINT.
# The shared stack lives in lithos-observability (docker compose up -d):
#   host run:   http://localhost:4318
#   container:  http://host.docker.internal:4318
endpoint = ""
console_fallback = false
service_name = "lithos-lens"
export_interval_ms = 30000

[lithos-lens.health]
refresh_interval_s = 30
