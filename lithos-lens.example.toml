# Lithos Lens configuration.
# Copy to lithos-lens.toml (cwd), ~/.lithos-lens/lithos-lens.toml, or
# /etc/lithos-lens/lithos-lens.toml and adjust to taste. Alternatively point
# LITHOS_LENS_CONFIG at this file.

[lithos-lens]
environment = "dev"
greeting = "Hello"

[lithos-lens.ui]
default_view = "tasks"

[lithos-lens.storage]
data_dir = "~/.lithos-lens/data"

[lithos-lens.logging]
level = "info"   # one of: debug, info, warning, error

[lithos-lens.lithos]
url = "http://localhost:8765"
mcp_sse_path = "/sse"
sse_events_path = "/events"
agent_id = "lithos-lens"

[lithos-lens.tasks]
auto_refresh_interval_s = 120
frontier_limit = 500   # cap pushed to the lithos ready/blocked frontier reads
default_time_range_days = 30    # resolved-at window for the completed/cancelled sections (1-365)
# Needs-attention thresholds (rules 3-6; unsatisfiable blockers and cycles are
# intrinsic and always flagged).
gate_waiting_attention_hours = 24   # human gate waiting on a person
claim_expiring_soon_minutes = 10    # claim about to lapse (expired claims are unobservable)
stale_open_age_days = 7             # workable open task nobody resolved
unclaimed_ready_age_minutes = 60    # ready frontier row the fleet has not picked up
default_status_groups = ["open", "completed", "cancelled"]
project_convention = "both"   # metadata | tag | both — which project convention ?project= honours
project_tag_key = "project"   # tag key reserved for the tag convention

[lithos-lens.graph]
# Task dependency graph pages (REQUIREMENTS §5.7). There is no bulk graph fetch
# upstream, so a page assembles its edges with one lithos_task_edge_list call
# per node, shared through a per-task cache.
cache_ttl_s = 30            # per-task edge cache TTL; task events evict, lens.refresh flushes
max_tasks = 300             # page-scope size guard, ghosts counted (1-2000); above it the page is refused
fetch_concurrency = 16      # semaphore over the per-task edge_list fan-out (1-64)
mini_graph_max_nodes = 40   # detail mini-graph cap, the focal task included

[lithos-lens.knowledge]
related_title_fanout_cap = 20   # cap on lithos_read title lookups per related panel (1-100)
search_limit = 20               # /knowledge?q= hybrid-search result cards (1-200)
recent_limit = 20               # /knowledge recently-updated + tag browse list length (1-200)

[lithos-lens.events]
enabled = true
reconnect_backoff_ms = [500, 1000, 2000, 5000, 10000]

[lithos-lens.llm]
enabled = false
provider = ""
model = ""
api_key = ""
base_url = ""
extra_headers_json = ""
max_tokens = 2048

[lithos-lens.telemetry]
# The OpenTelemetry packages are REQUIRED dependencies, so `enabled` is on by
# default and governs EXPORT, not whether the instrumentation exists. With no
# endpoint and no console fallback, spans are created and dropped -- which
# still puts trace_id on every log line. Set false to install no providers.
enabled = true
# Base OTLP/HTTP collector URL; /v1/traces, /v1/metrics and /v1/logs are
# derived from it. Empty falls back to the standard OTEL_EXPORTER_OTLP_ENDPOINT.
# The shared stack lives in lithos-observability (docker compose up -d):
#   host run:   http://localhost:4318
#   container:  http://host.docker.internal:4318
endpoint = ""
console_fallback = false
service_name = "lithos-lens"
export_interval_ms = 30000

[lithos-lens.health]
refresh_interval_s = 30
