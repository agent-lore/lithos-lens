[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lithos-lens"
version = "0.3.0"
description = "Lithos Lens"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dave Snowdon" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown-it-py>=3",
    "mcp>=1.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",
    "opentelemetry-sdk>=1.28",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
lithos-lens = "lithos_lens.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lithos_lens"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "grimp>=3.14",
    "import-linter>=2.12",
    "networkx>=3.0",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.importlinter]
# Directional architecture contract: dependencies must only point downward,
# Entrypoints -> Core -> Foundation. Expressed as `forbidden` contracts (not
# `layers`) because some core modules legitimately import siblings (e.g. state
# imports events + lithos_client), which a strict layers contract would reject.
root_package = "lithos_lens"

[[tool.importlinter.contracts]]
name = "Foundation must not import Core or Entrypoints"
type = "forbidden"
source_modules = [
    "lithos_lens.errors",
    "lithos_lens.tasks",
    "lithos_lens.task_filtering",
    "lithos_lens.task_detail",
    "lithos_lens.task_links",
    "lithos_lens.blocker_chain",
    "lithos_lens.normalizers",
    "lithos_lens.task_graph",
    "lithos_lens.frontier",
    "lithos_lens.gates",
    "lithos_lens.dashboard",
    "lithos_lens.attention",
    "lithos_lens.frontier_fallback",
    "lithos_lens.frontier_join",
    "lithos_lens.epic_strip",
    "lithos_lens.knowledge",
    "lithos_lens.knowledge_metadata",
    "lithos_lens.knowledge_produced_by",
    "lithos_lens.config",
    "lithos_lens.config_fields",
    "lithos_lens.config_schema",
    "lithos_lens.logging",
    "lithos_lens.telemetry",
]
forbidden_modules = [
    "lithos_lens.events",
    "lithos_lens.lithos_client",
    "lithos_lens.mcp_transport",
    "lithos_lens.fake_lithos",
    "lithos_lens.fake_dataset",
    "lithos_lens.state",
    "lithos_lens.web",
    "lithos_lens.request_filters",
    "lithos_lens.main",
    "lithos_lens.__main__",
]

[[tool.importlinter.contracts]]
name = "Core must not import Entrypoints"
type = "forbidden"
source_modules = [
    "lithos_lens.events",
    "lithos_lens.lithos_client",
    "lithos_lens.mcp_transport",
    "lithos_lens.fake_lithos",
    "lithos_lens.fake_dataset",
    "lithos_lens.state",
]
forbidden_modules = [
    "lithos_lens.web",
    "lithos_lens.request_filters",
    "lithos_lens.main",
    "lithos_lens.__main__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B101 (assert_used) fires on every pytest assertion, and the whole test tree —
# including the tests/guardrail "diagrams as tests" kit — is built on `assert`.
# Exclude the test/e2e trees rather than pepper hundreds of test asserts with
# per-line `# nosec`; application code under src/ is still scanned (see the
# inline `# nosec B104` in main.py). Run with `bandit -c pyproject.toml -r .`.
exclude_dirs = ["tests", "e2e", ".venv"]
