{#- The legend (K2 D5): only the types drawn, in the known-type order, one
    plain-language line each; the wiki-link and provenance lines when drawn. -#}
{% if view.legend %}
  <section class="panel kgraph-legend" data-kgraph-legend>
    <h2>Legend</h2>
    <dl>
      {% for line in view.legend %}
        <div class="kgraph-legend-row" data-legend-type="{{ line.type }}">
          <dt><code>{{ line.type }}</code></dt>
          <dd>{{ line.line }}</dd>
        </div>
      {% endfor %}
    </dl>
  </section>
{% endif %}
