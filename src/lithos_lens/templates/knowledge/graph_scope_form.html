{#- A typed-in scope: what the page offers when the snapshot has no facets
    to pick from, and beside them when it has. It keeps a full-page session
    full (D17). -#}
<form class="kgraph-scope-form" method="get" action="/knowledge/graph" data-kgraph-scope-form>
  <label>Edge type <input type="text" name="type" placeholder="e.g. contradicts"></label>
  <label>Namespace <input type="text" name="namespace" placeholder="e.g. influx"></label>
  {%- if params.canvas == "full" %}
  <input type="hidden" name="canvas" value="full">
  {%- endif %}
  <button type="submit">Draw</button>
</form>
