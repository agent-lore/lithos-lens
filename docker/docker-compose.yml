# Lithos Lens Docker Compose configuration
services:
  lithos-lens:
    image: ${LITHOS_LENS_IMAGE:-lithos-lens:dev}
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${LITHOS_LENS_CONTAINER_NAME:-lithos-lens}
    user: "${LITHOS_LENS_UID:-1000}:${LITHOS_LENS_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${LITHOS_LENS_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound the container log on disk. Docker's default json-file driver keeps
    # every line forever, and a single request can write one (an oversized
    # filter is refused with a warning line), so an unauthenticated GET would
    # otherwise grow the host's disk at roughly 1:1 with attacker bandwidth.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ${LITHOS_LENS_DATA_PATH:-./data}:/data
    environment:
      - LITHOS_LENS_CONFIG=/data/lithos-lens.toml
      - LITHOS_LENS_DATA_DIR=/data
      - LITHOS_LENS_ENVIRONMENT=${LITHOS_LENS_ENVIRONMENT:-dev}
      # OTLP collector (lithos-observability). host.docker.internal is already
      # mapped via extra_hosts above, the same way the Lithos URL reaches the
      # host. Unset leaves telemetry installed but exporting nothing.
      - LITHOS_LENS_OTEL_ENDPOINT=${LITHOS_LENS_OTEL_ENDPOINT:-}
