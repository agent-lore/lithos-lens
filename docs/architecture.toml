# Hard architecture budgets, checked by tests/guardrail/test_metrics_budgets.py
# against the metrics snapshot (docs/generated/metrics.md explains each one).
# CI fails if a measured value exceeds its budget. Raising a budget is allowed
# but must be an explicit, reviewed edit to this file; lower a budget after
# improving the code to lock in the gain.
#
# What a budget is FOR (operator policy, Dave, 2026-09-20, restated because it
# keeps being read the other way): a budget is a prompt for a decision, not a
# limit. Crossing one asks "is this a second responsibility, or the same one
# grown?" — and either answer is legitimate. A real seam gets an extraction; a
# change that is the same responsibility grown gets a raise, with a note here
# saying why. A sound architecture and good code are the priority, and an
# extraction whose only purpose is a number — one concern split across two
# modules so a counter stays put — is the wrong answer even when it makes the
# metric look better. The notes below record raises AND extractions; neither
# is the default, and no note here forbids the next raise. It only asks that
# the next one be argued as well as these were.
#
# Most budgets below are tight ratchets pinned at today's value (any regression
# fails CI). max_module_lines is the exception: it is a STOP-LOSS ceiling set a
# little above today's largest module so a big module can't quietly balloon — it
# is deliberately NOT pinned to the exact current high-water mark. Ratchet the
# *count* of oversized modules down via modules_over_800_lines instead.
[budgets]
# Raised 27 -> 29 for EventSubscriberLimit: Events raises it at the subscriber
# ceiling and Web catches it to answer 503. Both new edges land on Errors, the
# graph's only sink node — it imports nothing, so an edge to it adds no
# reachability and cannot create a cycle; it is the cheapest edge available.
# The alternative was a sentinel return from `subscribe`, which would have
# dodged this counter at the cost of `assert ... is not None` in eleven
# unrelated tests, and left the ceiling enforceable only by a caller that
# remembers to check.
# Raised 29 -> 30 for Entrypoint -> Telemetry. OTEL provider setup is
# process lifecycle, so main.py owns it: uvicorn runs create_app_from_config in
# the WORKER, and providers installed anywhere else would not be the ones the
# request path resolves. The alternative was setting telemetry up inside
# create_app, which would install global providers on every app the test suite
# builds and make the enabled path a side effect of constructing a router.
# Telemetry is Foundation, so the edge points down like every other one here.
# Raised 30 -> 31 for Telemetry -> Logging. The OTLP log-export handler runs no
# formatter, so MAX_LOGGED_VALUE_CHARS -- applied centrally in JsonFormatter --
# does not reach it, and an oversized request line would be exported to the
# collector verbatim. Telemetry therefore imports BoundedRecordFilter from
# Logging. The alternative was a second copy of the bound inside Telemetry,
# which would mean two independent definitions of "how long may a logged value
# be" and a silent divergence the first time one moved. Both components are
# Foundation, so the edge points sideways within a tier, not upward.
# Raised 31 -> 33 for the failure-mode metrics: LithosClient -> Telemetry (the
# MCP call funnel records per-tool outcome, latency and gate queue time) and
# Events -> Telemetry (the hub counts drops, deliveries and subscribers). Both
# are the point of the change rather than a side effect of it -- the signals
# that say WHY Lens is degraded live in those two components, and an
# instrumentation module they may not import cannot observe them. Telemetry is
# Foundation, so both edges point down.
# Raised 33 -> 35 for the T2 dependency-graph layer: Events -> TaskGraph (the
# hub evicts the per-task edge cache before each fan-out) and State -> TaskGraph
# (the cache is process-wide, so it is constructed on AppState beside the hub
# and wired into it there). Both are the point of the change: edge upserts emit
# no event upstream (ROADMAP ledger #1), so a task event is the ONLY signal that
# can invalidate an entry, and a cache the hub cannot reach would be corrected
# only by its TTL. The alternative -- an untyped callback registry on the hub --
# would dodge this counter while making the one invalidation path in the process
# unfindable from either end. TaskGraph is Foundation, so both edges point down.
# Raised 35 -> 38 for T3-W1's operator identity (REQUIREMENTS §5C.5). Three
# edges, one per reader of the new Writes component, and each is the point of
# the change rather than a side effect of it:
#   Web -> Writes      the write route group resolves the identity, runs the
#                      Origin check and renders the operator page; the chrome's
#                      identity chip is one template global over the same call.
#   Config -> Writes   `[writes].default_operator` is "validated at load
#                      EXACTLY like the cookie" (§5C.5), so the loader asks the
#                      module that owns the id rule. The alternative is a
#                      second copy of that rule in Config, which is the defect
#                      the requirement is written to prevent: the day the two
#                      copies disagree, a configured default resolves to
#                      nothing at the first write and no surface can say why.
#   Writes -> Tasks    the impersonation guard reads an agent's TYPE, so it
#                      consumes AgentRecord — the record `lithos_agent_list`
#                      and `lithos_agent_info` already normalize into.
# Directions: Web -> Writes is Entrypoints -> Foundation, like Web -> Tasks;
# the other two are sideways INSIDE Foundation, like Telemetry -> Logging.
#
# A new component rather than modules bolted onto Tasks, which is "dashboard
# data loading and normalization": an identity a write is attributed to, its
# guard against re-typing an agent, and the Origin/`next` rules are a
# different responsibility, read by three components that do not otherwise
# share one. Folding them into Tasks would have cost one edge instead of three
# and made the component's own description false — the cheaper metric, the
# worse architecture, which this file's policy calls the wrong answer.
# Raised 38 -> 39 for Knowledge -> Telemetry, on K2 S1 (the knowledge
# edge-table snapshot). The snapshot is the only place its signals exist: the
# fetch outcome (ok / refused / failed / stale) is decided inside
# knowledge_edges.EdgeTable, the patches are applied there, and its age is
# its own state. So the `lens.knowledge.edge_table` span is opened, the
# patch counter incremented and the age gauge registered from that module,
# with the instruments declared in metrics.py like every other — the same
# argument the failure-mode metrics made for LithosClient and Events. The
# alternative was a callback seam for a caller to record what the snapshot
# decided, which would dodge this counter while splitting one fetch's
# telemetry across two components. Both are Foundation, so the edge points
# sideways within a tier, like Telemetry -> Logging. The graph reads the
# snapshot uses were mixed into the client from a new LithosClient module
# (lithos_graph_reads.py, on the lithos_writes.py precedent), which adds no
# edge: LithosClient -> Knowledge already exists.
# Raised 39 -> 40 for State -> Knowledge, on K2 S3 (the /knowledge/graph
# page). The edge-table snapshot and the note facts cache are each ONE
# process-wide instance: the graph page, its panels (S5), the note page's
# contradiction banner (S6) and the hub's knowledge events (S7) must all see
# the same snapshot and the same facts, and the events patch them. That is
# exactly why the task graph's GraphCache already lives on AppState ("both
# halves of its invalidation are process-wide"), so the knowledge caches are
# constructed there beside it, from config.knowledge. The alternative — a
# route-module global built at registration — would hide process state in the
# Web tier, where the hub (Core) could not reach it without an upward import.
# Core -> Foundation points down, like State -> TaskGraph.
cross_component_edges  = 40   # +1 fake-mode event hub (fake_lithos -> events); +1 Web -> TaskGraph (frontier dashboard assembly); +1 Web -> Events (fake-mode publish seam constructs LensEvent); +2 refusal exception (events -> errors, web -> errors); +1 Entrypoint -> Telemetry (process-lifecycle OTEL setup); +1 Telemetry -> Logging (shared log-size bound); +2 failure-mode metrics (lithos_client -> telemetry, events -> telemetry); +1 edge-table snapshot telemetry (knowledge -> telemetry); +1 State -> Knowledge (the process-wide knowledge graph caches); direction: down
component_cycles       = 0    # no component-level cycles today; keep it that way
module_cycles          = 0    # no module-level cycles today; keep it that way
# The god-module exception is RETIRED. lithos_client was the one module the
# repo let past the 800-line ceiling, and three consecutive raises
# (800 -> 830 -> 815 -> 895) each bought transport hardening: the tools/list
# probe, then the per-call deadline, the process-wide call gate, and the
# decoder's notes — that a whole-response size ceiling was considered and
# REJECTED (an input-domain restriction dressed as a bound, which would answer
# a runaway edge list with "blockers unavailable"), and that the parse holds
# the GIL, an accepted residual a thread pool was found not to fix.
#
# Task 8b8a5888 has now DISCHARGED that debt: mcp_transport.py took the session
# worker, the reconnect/backoff, both call bounds and the result decoding, and
# lithos_client is 675 — the typed method surface over it. web.py briefly held
# a second slot (granted against 538e2f3d, discharged by request_filters.py).
#
# So the count goes to 0 and the allowance is handed back in the same change:
# max_module_lines now rests ON the god-module threshold rather than above the
# largest module, because with no exception left there is one uniform ceiling
# and no reason to sit anywhere else. Today's largest is knowledge.py at 781.
# A future exception must be argued from here, not from an inherited 895.
#
# Argued here (lens #85, 2026-09-13): frontier.py — the frontier/dashboard
# assembly — is 785 on the T2b branch and 800 on main after #84; composed it is
# 817. Each PR fit alone; together they do not, and the composition was found
# by loom's trial merge, not by either author. The operator's decision is to
# hold the count at ONE and lift the stop-loss to 850 rather than force an
# extraction whose only purpose is the number: the fallback-attention block
# (#85) and the skew-retry gating (#84) are both frontier assembly, and moving
# either into frontier_fallback.py to satisfy a ceiling would split one
# responsibility across two modules — a worse architecture for a better
# metric. The ceiling is a budget, not an absolute. Discharge it when frontier
# assembly grows a real second responsibility worth its own module.
#
# Revisited (task 0976cf72, 2026-09-14): the epic-strip scoping fix took
# frontier.py from 817 to 850 — ON the stop-loss, no headroom left. The change
# is +33 lines of assembly, not a second responsibility: the strip is derived
# from the same filter predicate and generation as the sections, which is the
# reason it has to be built HERE, and an extraction would again split one
# responsibility to satisfy a number. So the allowance stands at 850 and is
# NOT raised. It is also now spent: the next change that grows frontier.py has
# no room and must discharge the exception by extraction rather than argue the
# stop-loss up a fourth time.
#
# Raised 1 -> 2 for graph_layout.py (830), which crossed 800 from 799 carrying
# `BlockingChain.members` — the ACTIVE projection's condensation, which the
# chain walks and which NOTHING else in the render states (a node's cycle is
# the all-edge one the picture is drawn from, and the two legitimately
# differ). Without it the canvas traces a chain the text does not state
# (round-9 correctness f-001). It is +33 lines on the answer this module
# already computes, not a second responsibility. The extraction on offer —
# lifting the `parent_child` forest out — would need `_sort_key` and
# `_dedupe_edges` across the new seam, and cross_module_private_refs is
# budgeted at 0: satisfying this counter would cost either a wider public
# surface or a duplicated helper. So the count goes to 2 and graph_layout has
# the same standing as frontier.py: the next change that grows it must
# discharge the exception by extraction rather than argue this up again.
#
# Raised 2 -> 3 for tasks.py (829), which sat EXACTLY on the threshold at 800
# and so had no room for the T2 UX pass's ``created_since`` filter (§5.4) —
# +29 lines: one field, its parse, and the normalizer that gives the created
# window the same date syntax and the same tolerance of unreadable input the
# resolved window has. It is one more term in the filter vocabulary this module
# already defines (``TaskFilters`` / ``parse_filters``), not a second
# responsibility: the predicate that applies it lives in task_filtering.py and
# the URL that carries it in request_filters.py, which are the two seams
# already cut out of this module for exactly that reason.
#
# The extraction on offer — lifting the filter vocabulary (``parse_filters``,
# ``honored_tags``, the ``?since=`` normalizers and their key constants) into
# task_filtering.py — is a real seam and probably the right next move for
# tasks.py, but it rewrites the import surface of web.py, request_filters.py
# and the tests for a change that adds a query parameter. Deferred as its own
# task rather than smuggled in here. tasks.py now has the same standing as the
# other two: the next change that grows it must discharge the exception by
# that extraction rather than argue this up again.
#
# Revisited (task "Tag filter: autocomplete from the snapshot's tag union",
# 2026-09-20): the Tag datalist needed two lines of wiring in frontier.py,
# which at 850 had none — the case this file said must be answered by
# extraction rather than by a fourth raise. It was. The seam is a real one and
# it is NOT the one that was on offer before: the filter bar's three option
# universes (Project, Tag, Agent) are the only thing in load_dashboard built
# from the load's UNFILTERED rows, which is the exact inverse of the rest of
# the function — sections, counters, strip and gates all derive from the
# filtered set. That invariant ("what you can switch TO must not be collapsed
# by what you have switched to") was already restated in three docstrings; it
# now has one home, lithos_lens.filter_options, which owns the deduped loaded
# row set, the project data-quality pass over it, and the composition of the
# three builders (which stay with their vocabularies, in Tasks). frontier.py
# makes one call and is 844.
#
# So the stop-loss is NOT raised here, because a real seam existed. The
# exception is not discharged either — 844 is still over the 800 threshold —
# so the next change that grows frontier.py answers the same question again:
# a real seam if there is one, a reasoned raise if there is not. Six lines of
# headroom is a fact, not an instruction; see the policy at the top of this
# section.
#
# Revisited (task ac1380c1, 2026-09-20): the project quick-switch strip needed
# a builder and a Dashboard field in frontier.py, which at 844 had room for
# neither. The question was answered on the code, and the answer was a seam —
# the one the epic-strip note (0976cf72) named without taking: that note's own
# defence of building the strip in frontier.py — "it is derived from the same
# filter predicate and the same generation as the sections" — applies WORD FOR
# WORD to this second strip, and an argument that covers two strips identically
# is the description of a responsibility, not of an assembly detail.
# lithos_lens.board_strips now owns it: both strips of one generation, the epic
# scope the first resolves and the second is counted under, and the rule they
# share (a chip must lead to a board with rows on it). The generation discipline
# is not weakened by the move — it is made explicit, since the reads are passed
# in at the two points the assembly adopts a generation instead of being closed
# over as locals the skew retry rebinds. frontier.py keeps the join, the
# sections, the counters and the degraded-mode policy, and is 843.
#
# So the stop-loss is again not raised, because again a real seam existed — not
# because one had to be found. 843 is still over the 800 threshold, so the
# exception stands, and the next change that grows frontier.py asks the same
# question with the same two legitimate answers.
#
# Revisited (task "Show each task's short id beside its title", 2026-09-21):
# tasks.py reached 846 — +17 for the `short_id` filter and the constant behind
# it — leaving four lines of headroom, and the note recorded that the NEXT
# change growing tasks.py would discharge the exception by the filter-
# vocabulary extraction rather than arguing the ceiling up.
#
# That change is this one (round 2 of the same task): `BlockerChip` gained a
# `titled` field, so a blocked row's chip can state the short id of the task it
# names, and tasks.py crossed at 852. The pre-committed answer was taken, not
# revisited: template_vocabulary.py now holds `short_id`/`SHORT_ID_CHARS`,
# `format_display_date` and `format_tag` — the three filters `web.py` registers
# — and tasks.py is back under the ceiling. That IS the seam the note named:
# "how is a value spelled for a reader" is a different question from "what is a
# task", and it was already answerable in one file. The alternative was raising
# the stop-loss for a four-line dataclass field, which this file's own policy
# calls the weaker of the two legitimate answers when a real seam exists.
#
# No budget moves. The count stays 3 — one module left the >800 set and none
# joined it (template_vocabulary.py is ~55 lines) — and the stop-loss stays
# 850, now with frontier.py (843) as the module nearest it.
#
# Round 3 of the same task: `AttentionReason` gained the two fields that carry
# a named predecessor's identity to the template as an ID (+22 net), putting
# tasks.py at 845. Still no budget moves, and no second extraction either — the
# rationale for those fields was written out twice, here and in
# `attention._blocker_name`, so the duplicate prose went instead. Splitting a
# module again to absorb four lines of docstring is the answer this file's
# policy names as the wrong one.
#
# Raised 3 -> 4 for config.py (813), on the task "Task descriptions render as
# Markdown everywhere". config.py has sat AT the ceiling by construction since
# the schema split — config_schema.py's own docstring records why ("config.py
# sat at the guardrail's 800-line stop-loss, and every new operator knob adds
# to both halves") — and it was 799. `[tasks].description_preview_chars` costs
# it 14: the knob, its env override, and the floor map that lets ONE [tasks]
# knob be legitimately 0 (the documented "never truncate") without lowering the
# >= 1 floor the other eight need.
#
# That is the same responsibility grown, not a second one: this module parses
# the file and applies the environment over it, and this is one more value of
# each. The extraction on offer — lifting the env-override pass
# (`_apply_env_overrides`, `_parse_env_int`, `_parse_env_str_list`) into a
# `config_env.py` — is a real seam and probably the right next move: it is the
# highest-complexity function in the repo (33) and the one the docs<->code env
# guardrail scans by AST. But it moves ~230 lines and rewrites that guardrail's
# entry point for a change that adds a config knob, which is the shape this
# file called "smuggled in" when tasks.py was in the same position (829).
# Deferred as its own task, on the same terms tasks.py got: config.py now has
# that standing, and the NEXT change that grows it discharges the exception by
# that extraction rather than arguing this up a second time.
#
# web.py is deliberately NOT here. It needed the same feature's template-
# environment wiring and had 7 lines of room; the registration was made to fit
# by giving the surfaces ONE global (what a description shows AND how it is
# rendered) instead of a filter/global pair — a smaller public surface, so the
# ceiling bought something rather than being paid off with a raise. It is at
# exactly 800.
#
# T3-W1 (2026-10-03) DISCHARGED config.py's exception, on the terms the note
# above set. The `[lithos-lens.writes]` knobs — `default_operator` with the
# id validation §5C.5 requires at load, and `confirm_cancel` — cost config.py
# ~70 lines, and at 813 it had 37. The pre-committed answer was taken rather
# than revisited: `config_env.py` now holds the environment-override pass
# (`apply_env_overrides` and its three value parsers), and config.py is 606.
#
# That is the seam the note named, and it is a real one: config.py answers
# "what does this FILE say", one function per [lithos-lens.*] table over a
# parsed TOML dict; config_env.py answers "what does the ENVIRONMENT say over
# it", one pass over an already-valid LithosLensConfig. It was also the
# highest-complexity function in the repo and the one the docs<->code env
# guardrail scans by AST — `tests/test_config_env_prefix.py` now scans BOTH
# halves, so an override added to either file stays visible to it.
#
# web.py JOINED the >800 set in the same change, at 830 from exactly 800: the
# write route group's registration (ordered before `/tasks/{task_id}`, which
# is the whole point) and the reserved-segment refusal that keeps
# `/tasks/new` from ever being routed as a task id. That is this module's one
# responsibility grown — it is the app factory, and this is one more route
# group plus one route's guard — not a second one appearing. No budget moves
# for it: the count stays 4 because config.py left the set as web.py joined
# it, and the stop-loss stays 850 with tasks.py (849) nearest it. web.py now
# carries the same standing the others do: the next change that grows it
# answers the question again, with a real seam if there is one.
#
# Raised 4 -> 5 for write_errors.py (825), on T3-W4. The write funnel refuses
# some writes ITSELF before Lithos sees them — a stale `expected_status`, a
# form naming no status, a task the action does not apply to, an identity the
# registry will not write under — and those refusals must read exactly like
# Lithos's own: same claim ("Nothing was changed."), same pages, same notice.
# Clarification 7 (Dave, 2026-10-04) puts the builder for them in
# write_errors, as a PUBLIC function, because the table's row builders are
# private and `cross_module_private_refs = 0` forbids the funnel reaching
# them. That is the module's one responsibility grown — "a write that did not
# apply, as copy and a status" — by one more source of such writes, not a
# second responsibility. The extraction on offer (the message-segmentation
# helpers, ~70 lines) would split how one refusal's copy is built across two
# modules for a counter, which this file's policy calls the wrong answer. The
# stop-loss does not move: 825 is under 850, and tasks.py (849) stays nearest.
#
# Raised 5 -> 6, and the stop-loss 850 -> 875, for write_funnel.py (871), on
# T3-W7. Create has no task to pre-check, so it enters the funnel through a
# second, task-less door, `submit_create` — and the clarifications that settle
# the slice (D1, Dave, 2026-10-05) put that door IN the funnel on purpose: the
# Origin check, the operator and register-once, the one audit line, span and
# counter, and the receipt are the funnel's guarantees only because nothing
# reaches Lithos around them, and a create path in another module would be
# exactly the "second path to Lithos for writes" D4 exists to prevent. It is
# the module's one responsibility — "the single path a curated write takes"
# — grown by its first write that does not act on an existing task, not a
# second responsibility. The extraction on offer (a `create_funnel.py` beside
# it) would need the funnel's ledger and record step across the seam, and
# `cross_module_private_refs = 0` forbids that: it would cost either a wider
# public surface for plumbing no route should touch, or a duplicated record
# step — two definitions of the audit line, the defect that budget protects.
# What COULD be shared was: the registration refusal both doors give is now
# one helper rather than two copies. The form model and the de-duplication
# coordinator went to their own Writes modules (create_form.py,
# create_coordinator.py), and the routes to create_routes.py, so the funnel
# holds only the steps themselves. The stop-loss moves just past the new
# largest module, as its definition says it should; it is fully spent again.
#
# Raised 875 -> 880 for write_funnel.py (880), on T3-W8 (add a dependency).
# The edge action must refuse BEFORE its call when its fresh edge read fails
# — an upsert then could replace the metadata of an edge Lens could not see —
# and the funnel classified anything `perform` raised as the write's own
# failure. The clarifications that settle the slice (D3, recheck against W7,
# Dave, 2026-10-05) ask for "the smallest funnel hook that lets `perform`
# return a refusal", in this module, and name this raise as the way to pay
# for it. It is: `perform` may answer a WriteProblem, which the funnel
# answers as is (+2), and the action's facts ride on WriteDone / WriteReceipt
# as fields the way W6's CancelFacts do, the `already_exists` fact reaching
# the span and the audit line (+4); the rest is `perform`'s widened type,
# one import and the docstrings saying so. The
# same responsibility — "the single path a curated write takes" — grown by
# the first action that may decline its own call, not a second one; the
# routes, the sentence model and the fresh read live in edge_routes.py and
# relation_sentences.py. No extraction was on offer that would not move the
# record step across a seam `cross_module_private_refs = 0` forbids. The
# count stays 6; the stop-loss is fully spent again.
#
# Revisited (task "Tasks dashboard: under a scope filter, show the gates that
# in-scope tasks wait on", 2026-10-10): frontier.py grew 843 -> 863. The seam
# was taken first: the rule itself — which open gates a scoped board shows,
# the waiter map behind it and its degraded edge reads — is a new module,
# lithos_lens.gate_scope, and the project strip's share lives in board_strips.
# What stays here (+20 net) is wiring the assembly owns by this file's own
# definition: one call at the point the generation settles, feeding the scoped
# set to Needs attention, the Gates section and the strip, with the two
# flag_attention calls folded into one. No budget moves; the count stays 6
# and frontier.py is now 17 lines under the 880 stop-loss.
modules_over_800_lines = 6    # write_funnel.py (880), tasks.py (849), frontier.py (863), web.py (830), graph_layout.py (830), write_errors.py (825)
max_module_lines       = 880  # stop-loss over those exceptions, fully spent; the threshold stays 800
cross_module_private_refs = 0  # no cross-module private reaches today; keep it that way
tests_private_imports     = 0  # tests use only the public surface; keep it that way

# Domain class diagram: the task/event/health frozen dataclasses. The config
# (settings) dataclasses are configuration, not domain entities, so excluded.
# test_domain_model_diagram asserts EVERY public model's module is in include or
# exclude — a new model in an unlisted module fails until it is classified.
[domain]
include_modules = [
    "lithos_lens.tasks",
    "lithos_lens.task_writes",
    "lithos_lens.agent_picker",
    "lithos_lens.filter_options",
    "lithos_lens.dashboard",
    "lithos_lens.gates",
    # GateWaits: who waits on which open gate, and the gates that brings into
    # a scoped board.
    "lithos_lens.gate_scope",
    "lithos_lens.pr_reconciliation",
    "lithos_lens.task_detail",
    "lithos_lens.task_links",
    "lithos_lens.blocker_chain",
    "lithos_lens.task_graph",
    "lithos_lens.graph_cache",
    "lithos_lens.graph_fanout",
    "lithos_lens.graph_scope",
    "lithos_lens.graph_layout",
    "lithos_lens.graph_cycles",
    "lithos_lens.graph_view",
    "lithos_lens.graph_snapshot",
    "lithos_lens.graph_impact",
    "lithos_lens.graph_page",
    "lithos_lens.graph_mini",
    # CancelConsequences, DownstreamWalk and ClaimHolder: what cancelling a
    # task strands, releases and keeps — a view model over the edge cache, like
    # graph_impact's downstream count.
    "lithos_lens.cancel_consequences",
    # RelationSentence and Relation: the add-dependency sentences and the edge
    # each one means — what the operator asks for, before Lithos sees it.
    "lithos_lens.relation_sentences",
    "lithos_lens.knowledge",
    "lithos_lens.knowledge_resolver",
    "lithos_lens.knowledge_metadata",
    "lithos_lens.knowledge_produced_by",
    "lithos_lens.knowledge_search",
    # EdgeWhy and EdgeEvidence: why a typed edge exists, as the related
    # panel's "why?" disclosure states it — parsed from the edge row.
    "lithos_lens.knowledge_edge_evidence",
    # RecentLanding and NamespaceFacet: the browse landing's two sections
    # (your notes, recent intake) and its namespace filter row.
    "lithos_lens.knowledge_landing",
    # TagCount, TagFamily and TagBrowse: the tag browse page's ranked counts,
    # its key: family facet row, and the capped list it renders.
    "lithos_lens.knowledge_tags",
    # KnowledgeEdge, EdgeTableSnapshot, EdgeFacets and EdgeTableRefusal: one
    # row of the Lithos edge table, the whole table as the graph reads it (with
    # its indexes and picker facets), and the refusal kept when it is over the
    # bound. KnowledgeEdge, not EdgeRecord: task_graph's task edge has that name.
    "lithos_lens.knowledge_edges",
    # KnownEdgeType, EdgeStyle and LegendLine: the known edge-type table, how
    # one edge row draws, and one legend entry.
    "lithos_lens.knowledge_edge_types",
    # NoteFacts, NoteFactsAnswer, NoteFactsTally and NoteFactsBatch: what a
    # graph node shows of its note, one render's answer for a node (ok,
    # pending, unread or missing — the ghost), and what the lookup cost.
    "lithos_lens.knowledge_facts",
    # KnowledgeTypedGraph: the typed-edge half of a knowledge graph view, from
    # the snapshot alone, with its cap verdict — before any Lithos read.
    "lithos_lens.knowledge_graph",
    # KnowledgeGraphView and its parts (nodes, edges, layer refs, filters,
    # hidden counts, provenance facets, refusal). Knowledge-prefixed: the
    # task graph's GraphNode / GraphEdge / NodeView / EdgeView have the
    # short names.
    "lithos_lens.knowledge_graph_view",
    "lithos_lens.events",
    "lithos_lens.state",
    "lithos_lens.lithos_client",
    # OperatorIdentity and IdentityCheck: who a write is attributed to and the
    # verdict on that identity. Domain entities, not configuration — the
    # configured default is one SOURCE of an identity, and it lives in
    # WritesConfig, which is excluded below with the rest of config.
    "lithos_lens.operator",
    "lithos_lens.write_errors",
    # WriteReceipt and ReceiptTask: what a write reported, as the operator is
    # shown it once. Domain (an outcome of the operator's action), not the
    # store's plumbing — ReceiptStore is a class, not a model.
    "lithos_lens.receipts",
    # GateOverride: what the Proceed anyway page states about a machine-owned
    # gate — what would resolve it and the waiters completing it releases. A
    # view model over the Gates section's own row, like task_detail's.
    "lithos_lens.gate_override",
    # CreateInput, CreateRequest and FieldError: the create form as typed and
    # the one create it asks for, with where a refusal lands — the operator's
    # request, like the operator identity it is sent under.
    "lithos_lens.create_form",
    # Created / OutcomeUnknown / Refused and Settled: what a create came to,
    # as Lens remembers it per request id — the outcomes the "not visible yet"
    # page and the de-duplicated landing are stated from.
    "lithos_lens.create_coordinator",
]
# fake_lithos holds fixture plumbing (FakeEventHub/FakeLithosClient) and
# fake_dataset (with fake_graph_dataset, the demo's dependency-graph half, and
# fake_knowledge_dataset, its related-panel neighborhoods) its fixture bundle
# (FakeLithosDataset) — not domain entities. fake_writes is the
# same kind of thing for the write half, and fake_store for the effective store
# under it: FakeWriteOverlay/FakeStoreView/FakeWriteStore are the fixture's
# mutable state, not a model of the domain.
# attention holds AttentionPolicy, which is threshold configuration (the same
# reason config is excluded); its domain model, AttentionReason, lives in
# lithos_lens.tasks and IS diagrammed.
exclude_modules = [
    "lithos_lens.attention",
    "lithos_lens.config",
    "lithos_lens.config_env",
    "lithos_lens.config_schema",
    "lithos_lens.errors",
    "lithos_lens.fake_lithos",
    "lithos_lens.fake_writes",
    "lithos_lens.fake_store",
    "lithos_lens.fake_dataset",
    "lithos_lens.fake_graph_dataset",
    "lithos_lens.fake_knowledge_dataset",
    # The funnel's own carriers (WriteForm, WriteDone, TaskWrite): what a route
    # hands the funnel and what an action hands back — request plumbing, not a
    # model of anything the operator or Lithos would recognise.
    "lithos_lens.write_funnel",
    # The cancel route group: route plumbing and template globals. The facts
    # it carries are CancelFacts, a receipts model diagrammed with them.
    "lithos_lens.cancel_routes",
    # The create route group: route plumbing and template globals.
    "lithos_lens.create_routes",
    # The knowledge route group: route plumbing. NoteBackLink is the note
    # page's back-link href and label — where this request came from, not a
    # model of anything in Lithos.
    "lithos_lens.knowledge_routes",
    # The knowledge graph route: route plumbing. KnowledgeGraphParams is the
    # page's parsed query and KnowledgeGraphPicker what the unscoped page
    # offers from the snapshot's facets — request state, not a model of
    # anything in Lithos (the graph's records are knowledge_graph_view's).
    "lithos_lens.knowledge_graph_routes",
]
