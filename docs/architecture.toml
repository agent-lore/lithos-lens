# Architecture model for the "diagrams as tests" guardrail.
#
# Single source of truth for:
#   - the generated component diagram + per-component pages
#   - which modules are scanned for the domain class diagram
#   - the architecture metrics snapshot and its hard budgets
#
# The directional layering contract lives in pyproject.toml
# ([tool.importlinter]); the tiers below document that intent (dependencies must
# only point downward, Entrypoints -> Core -> Foundation) and group the diagram.
#
# `component_of()` matches a module to a component by LONGEST module-prefix.
#
# This project uses the portable guardrail kit (tests/guardrail/ + scripts/) with
# only the core views enabled. The kit's two optional adapters — [tool_catalog]
# (a decorator-registered MCP tool surface) and [containers] (on-disk data
# stores) — are omitted: lithos-lens is an MCP client with no server tool surface
# and holds no stores of its own (state lives in the remote Lithos server).

[project]
root_package = "lithos_lens"
src_layout   = "src"

# One-line description per component, shown at the top of its drill-down page
# (docs/generated/components/<Component>.md). test_component_pages requires one
# for every component in [components].
[component_docs]
Entrypoint   = "Command-line entry point for the Lithos Lens web app (`python -m lithos_lens`)."
Web          = "FastAPI application factory serving the server-rendered dashboard UI (Jinja2 templates + static assets), plus the request-scoped filter parsing and the URL builders that carry those filters across navigation."
State        = "Application state and startup/shutdown orchestration (AppState, HealthSnapshot)."
Events       = "Shared Lithos event subscription and browser fan-out over SSE (LensEvent, EventHub)."
LithosClient = "Lithos server clients — the MCP transport (one shared session, its reconnect, the per-call deadline and process-wide gate, result decoding), the typed method surface over it plus the HTTP health probe, and the in-memory fake that backs fake-Lithos app mode."
Config       = "Configuration: the typed schema (dataclasses, defaults, ceilings) plus loading from lithos-lens.toml with env overrides."
Tasks        = "Tasks-dashboard data loading and normalization (task/claim/finding records + view models)."
TaskGraph    = "Task-graph transport records and normalizers (blocked-task rows + edges), plus the ready/blocked frontier join, the Needs-attention severity model, the Gates section assembly, the dashboard assembly built on them, and the graph-native task-detail page with its bounded neighbour reads and its lazily expanded blocker chain."
Knowledge    = "Knowledge-note rendering and normalization (safe server-side markdown, the related-panel neighborhood/view models with their backend fan-out count, the frontmatter metadata chips + lede, and wiki-link resolution recording which arm decided)."
Logging      = "Structured JSON logging setup (JsonFormatter)."
Telemetry    = "OpenTelemetry setup and the named metric-instrument catalogue: providers, exporter selection, the FastAPI/httpx instrumentation, and one function per instrument so every metric name, unit and label set is declared in one reviewable place. A required dependency, on by default; `telemetry.enabled` governs export, not whether the instrumentation exists."
Errors       = "Exception hierarchy rooted at LithosLensError."

[components]
Entrypoint   = ["lithos_lens.main", "lithos_lens.__main__"]
Web          = ["lithos_lens.web", "lithos_lens.request_filters", "lithos_lens.knowledge_routes"]
State        = ["lithos_lens.state"]
Events       = ["lithos_lens.events"]
LithosClient = ["lithos_lens.lithos_client", "lithos_lens.mcp_transport", "lithos_lens.fake_lithos", "lithos_lens.fake_dataset"]
Config       = ["lithos_lens.config", "lithos_lens.config_fields", "lithos_lens.config_schema"]
Tasks        = ["lithos_lens.tasks", "lithos_lens.task_filtering", "lithos_lens.normalizers"]
TaskGraph    = ["lithos_lens.task_graph", "lithos_lens.frontier", "lithos_lens.frontier_fallback", "lithos_lens.frontier_join", "lithos_lens.epic_strip", "lithos_lens.attention", "lithos_lens.gates", "lithos_lens.dashboard", "lithos_lens.task_detail", "lithos_lens.task_links", "lithos_lens.blocker_chain", "lithos_lens.graph_layout"]
Knowledge    = ["lithos_lens.knowledge", "lithos_lens.knowledge_resolver", "lithos_lens.knowledge_metadata", "lithos_lens.knowledge_produced_by"]
Logging      = ["lithos_lens.logging"]
Telemetry    = ["lithos_lens.telemetry", "lithos_lens.metrics"]
Errors       = ["lithos_lens.errors"]

[tiers]
Entrypoints = ["Entrypoint", "Web"]
Core        = ["State", "Events", "LithosClient"]
Foundation  = ["Config", "Tasks", "TaskGraph", "Knowledge", "Logging", "Telemetry", "Errors"]

# Hard architecture budgets, checked by tests/guardrail/test_metrics_budgets.py
# against the metrics snapshot (docs/generated/metrics.md explains each one).
# CI fails if a measured value exceeds its budget. Raising a budget is allowed
# but must be an explicit, reviewed edit to this file; lower a budget after
# improving the code to lock in the gain.
#
# Most budgets below are tight ratchets pinned at today's value (any regression
# fails CI). max_module_lines is the exception: it is a STOP-LOSS ceiling set a
# little above today's largest module so a big module can't quietly balloon — it
# is deliberately NOT pinned to the exact current high-water mark. Ratchet the
# *count* of oversized modules down via modules_over_800_lines instead.
[budgets]
# Raised 27 -> 29 for EventSubscriberLimit: Events raises it at the subscriber
# ceiling and Web catches it to answer 503. Both new edges land on Errors, the
# graph's only sink node — it imports nothing, so an edge to it adds no
# reachability and cannot create a cycle; it is the cheapest edge available.
# The alternative was a sentinel return from `subscribe`, which would have
# dodged this counter at the cost of `assert ... is not None` in eleven
# unrelated tests, and left the ceiling enforceable only by a caller that
# remembers to check.
# Raised 29 -> 30 for Entrypoint -> Telemetry. OTEL provider setup is
# process lifecycle, so main.py owns it: uvicorn runs create_app_from_config in
# the WORKER, and providers installed anywhere else would not be the ones the
# request path resolves. The alternative was setting telemetry up inside
# create_app, which would install global providers on every app the test suite
# builds and make the enabled path a side effect of constructing a router.
# Telemetry is Foundation, so the edge points down like every other one here.
# Raised 30 -> 31 for Telemetry -> Logging. The OTLP log-export handler runs no
# formatter, so MAX_LOGGED_VALUE_CHARS -- applied centrally in JsonFormatter --
# does not reach it, and an oversized request line would be exported to the
# collector verbatim. Telemetry therefore imports BoundedRecordFilter from
# Logging. The alternative was a second copy of the bound inside Telemetry,
# which would mean two independent definitions of "how long may a logged value
# be" and a silent divergence the first time one moved. Both components are
# Foundation, so the edge points sideways within a tier, not upward.
# Raised 31 -> 33 for the failure-mode metrics: LithosClient -> Telemetry (the
# MCP call funnel records per-tool outcome, latency and gate queue time) and
# Events -> Telemetry (the hub counts drops, deliveries and subscribers). Both
# are the point of the change rather than a side effect of it -- the signals
# that say WHY Lens is degraded live in those two components, and an
# instrumentation module they may not import cannot observe them. Telemetry is
# Foundation, so both edges point down.
cross_component_edges  = 33   # +1 fake-mode event hub (fake_lithos -> events); +1 Web -> TaskGraph (frontier dashboard assembly); +1 Web -> Events (fake-mode publish seam constructs LensEvent); +2 refusal exception (events -> errors, web -> errors); +1 Entrypoint -> Telemetry (process-lifecycle OTEL setup); +1 Telemetry -> Logging (shared log-size bound); +2 failure-mode metrics (lithos_client -> telemetry, events -> telemetry); direction: down
component_cycles       = 0    # no component-level cycles today; keep it that way
module_cycles          = 0    # no module-level cycles today; keep it that way
# The god-module exception is RETIRED. lithos_client was the one module the
# repo let past the 800-line ceiling, and three consecutive raises
# (800 -> 830 -> 815 -> 895) each bought transport hardening: the tools/list
# probe, then the per-call deadline, the process-wide call gate, and the
# decoder's notes — that a whole-response size ceiling was considered and
# REJECTED (an input-domain restriction dressed as a bound, which would answer
# a runaway edge list with "blockers unavailable"), and that the parse holds
# the GIL, an accepted residual a thread pool was found not to fix.
#
# Task 8b8a5888 has now DISCHARGED that debt: mcp_transport.py took the session
# worker, the reconnect/backoff, both call bounds and the result decoding, and
# lithos_client is 675 — the typed method surface over it. web.py briefly held
# a second slot (granted against 538e2f3d, discharged by request_filters.py).
#
# So the count goes to 0 and the allowance is handed back in the same change:
# max_module_lines now rests ON the god-module threshold rather than above the
# largest module, because with no exception left there is one uniform ceiling
# and no reason to sit anywhere else. Today's largest is knowledge.py at 781.
# A future exception must be argued from here, not from an inherited 895.
modules_over_800_lines = 0    # the exception is discharged; no module may retake it
max_module_lines       = 800  # the god-module threshold itself, no allowance above it
cross_module_private_refs = 0  # no cross-module private reaches today; keep it that way
tests_private_imports     = 0  # tests use only the public surface; keep it that way

# Domain class diagram: the task/event/health frozen dataclasses. The config
# (settings) dataclasses are configuration, not domain entities, so excluded.
# test_domain_model_diagram asserts EVERY public model's module is in include or
# exclude — a new model in an unlisted module fails until it is classified.
[domain]
include_modules = [
    "lithos_lens.tasks",
    "lithos_lens.dashboard",
    "lithos_lens.gates",
    "lithos_lens.task_detail",
    "lithos_lens.task_links",
    "lithos_lens.blocker_chain",
    "lithos_lens.task_graph",
    "lithos_lens.graph_layout",
    "lithos_lens.knowledge",
    "lithos_lens.knowledge_resolver",
    "lithos_lens.knowledge_metadata",
    "lithos_lens.knowledge_produced_by",
    "lithos_lens.events",
    "lithos_lens.state",
    "lithos_lens.lithos_client",
]
# fake_lithos holds fixture plumbing (FakeEventHub/FakeLithosClient) and
# fake_dataset its fixture bundle (FakeLithosDataset) — not domain entities.
# attention holds AttentionPolicy, which is threshold configuration (the same
# reason config is excluded); its domain model, AttentionReason, lives in
# lithos_lens.tasks and IS diagrammed.
exclude_modules = [
    "lithos_lens.attention",
    "lithos_lens.config",
    "lithos_lens.config_schema",
    "lithos_lens.errors",
    "lithos_lens.fake_lithos",
    "lithos_lens.fake_dataset",
]
