# Architecture model for the "diagrams as tests" guardrail.
#
# Single source of truth for:
#   - the generated component diagram + per-component pages
#   - which modules are scanned for the domain class diagram
#   - the architecture metrics snapshot and its hard budgets
#
# The directional layering contract lives in pyproject.toml
# ([tool.importlinter]); the tiers below document that intent (dependencies must
# only point downward, Entrypoints -> Core -> Foundation) and group the diagram.
#
# `component_of()` matches a module to a component by LONGEST module-prefix.
#
# This project uses the portable guardrail kit (tests/guardrail/ + scripts/) with
# only the core views enabled. The kit's two optional adapters — [tool_catalog]
# (a decorator-registered MCP tool surface) and [containers] (on-disk data
# stores) — are omitted: lithos-lens is an MCP client with no server tool surface
# and holds no stores of its own (state lives in the remote Lithos server).

[project]
root_package = "lithos_lens"
src_layout   = "src"

# One-line description per component, shown at the top of its drill-down page
# (docs/generated/components/<Component>.md). test_component_pages requires one
# for every component in [components].
[component_docs]
Entrypoint   = "Command-line entry point for the Lithos Lens web app (`python -m lithos_lens`)."
Web          = "FastAPI application factory serving the server-rendered dashboard UI (Jinja2 templates + static assets), plus the request-scoped filter parsing and the URL builders that carry those filters across navigation, and the knowledge, task-graph and curated-write route groups extracted from it — the last with the write funnel every curated write goes through (Origin check, operator, pre-check, the single Lithos call, classification, audit line + span + counter, receipt, and the dual-mode 303 / HTMX answer), and the Proceed anyway confirm page's reads for a machine-owned gate (what would resolve it, and the waiters completing it releases), and the cancel action's routes — its consequence confirm page and the funnel action that, with `confirm_cancel` off, reads the consequences just before the cancel and carries them on the receipt — and the create action's routes: the one create form with its project datalist and pre-fill, the POST through the funnel's task-less entry point, and the \"not visible yet\" page with Start again; and the add-dependency routes: the relation confirm step (the other task resolved by prefix, the focal task's edges read fresh, the relation restated with both titles and its readiness meaning, or \"already exists\") and the edge write through the funnel, whose action re-reads before its one upsert and evicts both endpoints after it."
State        = "Application state and startup/shutdown orchestration (AppState, HealthSnapshot)."
Events       = "Shared Lithos event subscription and browser fan-out over SSE (LensEvent, EventHub)."
LithosClient = "Lithos server clients — the MCP transport (one shared session, its reconnect, the per-call deadline and process-wide gate, result decoding), the typed method surface over it (with the task writes and the knowledge-graph reads mixed in) plus the HTTP health probe, and the in-memory fake that backs fake-Lithos app mode: its frozen fixture bundle, the effective store over it (the per-instance write overlay and the readiness oracle that makes a write change what later reads return), and the five writes with upstream's refusal vocabulary."
Config       = "Configuration: the typed schema (dataclasses, defaults, ceilings), the TOML loading over it, and the environment-override pass applied on top (env beats file beats default)."
Writes       = "Curated write actions (REQUIREMENTS §5C), minus their routes: the operator identity a write is attributed to — the id rule, the cookie/default resolution, the impersonation guard over the exact agent lookup, and the register-once ledger — plus the request-level hygiene every write POST goes through (the Origin/Referer check and the same-origin relative-path rule for a `next` destination), and the pure error mapper that turns a Lithos write refusal — or no answer at all — into operator copy, a change claim and an HTTP status, with the pages it feeds; plus the write receipts (the bounded, shown-once store a write's outcome waits in for the page its redirect lands on) and the complete-a-gate rules (which gates carry the direct Complete action and which the Proceed anyway confirmation, the not-a-gate refusal, the default outcome of a direct completion and of an override); plus the create-form model (form → validated create request, the project under both conventions, the gate types a person may create, and where an upstream refusal lands on the form) and the create coordinator (the in-process, bounded map from request id to outcome that makes a double submit create one task)."
Tasks        = "Tasks-dashboard data loading and normalization (task/claim/finding records + view models), plus the task-write wire: one request builder and one result record per Lithos write tool."
TaskGraph    = "Task-graph transport records and normalizers (blocked-task rows + edges), plus the ready/blocked frontier join, the Needs-attention severity model, the Gates section assembly and the gate scope (which open gates a scoped board shows: its own match, or an in-scope waiter's), the dashboard assembly built on them, the graph-native task-detail page with its bounded neighbour reads and its lazily expanded blocker chain, and the dependency-graph layer: the per-task edge cache (TTL, single-flight, event-evicted), the scope assembly that turns a project or epic plus that cache into a node/edge set with its ghosts, edge states and completeness, the scoped blocked reads carrying Lithos's cycle verdict, and the graph page's view model (layers, callout, chain, hierarchy, embedded payload) with the downstream-impact count the side panel states, plus the task-detail mini-graph's own two-up-one-down scope and its capped node selection, and the cancel consequences: the bounded, cross-project downstream walk over active dependency edges that says what a cancel strands directly and behind, with the claims it releases and the open children it keeps, and the add-dependency relation sentences: each sentence about a task mapped to the edge it means (and back), whether the relation is already among a task's edges, and what it will mean for readiness by the blocker's status."
Knowledge    = "Safe server-side markdown and the knowledge-note surface built on it: the note renderer with its escaping and link-scheme rules, the task-description variant of it (soft breaks kept, wiki-links literal) with the block-boundary cut a board row shows, the related-panel neighborhood/view models with their backend fan-out count and each typed edge's parsed evidence and provenance (its \"why?\"), the frontmatter metadata chips + lede, the search-result view model, the browse landing's intake split and namespace filter row, the tag browse page's ranked counts and key: family facet, and wiki-link resolution recording which arm decided; plus the knowledge graph's data layer — the edge-table snapshot (the whole Lithos edge table from one unfiltered read, its endpoint/type/namespace indexes and picker facets, held under a TTL with single-flight, refused over its row bound with filtered reads still served, served stale when a refetch fails, and patched from edge.upserted) and the known edge-type table (direction, symmetry, style, unknown types drawn as recorded, and the legend lines); the note facts cache behind every graph node (title, type, status, namespace, confidence and lede from a gated, per-render-capped `lithos_read(max_length=1)` fan-out under a TTL, the missing-note ghost for `doc_not_found`, and the note-event patches that set a title and mark the rest stale); and the graph assembly over them — focus (ego) graphs at depth 1 or 2 and scoped-global graphs by type and/or namespace, the weight and provenance filters applied before expansion and the cap, the node cap as a refusal naming its remedy, the would-be node count per depth, hidden-edge counts, the one-hop wiki-link and provenance layers from one `lithos_related` read, degree in view, the facts read order — and the view model and JSON payload the page renders."
Logging      = "Structured JSON logging setup (JsonFormatter)."
Telemetry    = "OpenTelemetry setup and the named metric-instrument catalogue: providers, exporter selection, the FastAPI/httpx instrumentation, and one function per instrument so every metric name, unit and label set is declared in one reviewable place. A required dependency, on by default; `telemetry.enabled` governs export, not whether the instrumentation exists."
Errors       = "Exception hierarchy rooted at LithosLensError."

