# Architecture model for the "diagrams as tests" guardrail.
#
# Single source of truth for:
#   - the generated component diagram + per-component pages
#   - which modules are scanned for the domain class diagram
#   - the architecture metrics snapshot and its hard budgets
#
# The directional layering contract lives in pyproject.toml
# ([tool.importlinter]); the tiers below document that intent (dependencies must
# only point downward, Entrypoints -> Core -> Foundation) and group the diagram.
#
# `component_of()` matches a module to a component by LONGEST module-prefix.
#
# This project uses the portable guardrail kit (tests/guardrail/ + scripts/) with
# only the core views enabled. The kit's two optional adapters — [tool_catalog]
# (a decorator-registered MCP tool surface) and [containers] (on-disk data
# stores) — are omitted: lithos-lens is an MCP client with no server tool surface
# and holds no stores of its own (state lives in the remote Lithos server).

[project]
root_package = "lithos_lens"
src_layout   = "src"

# One-line description per component, shown at the top of its drill-down page
# (docs/generated/components/<Component>.md). test_component_pages requires one
# for every component in [components].
[component_docs]
Entrypoint   = "Command-line entry point for the Lithos Lens web app (`python -m lithos_lens`)."
Web          = "FastAPI application factory serving the server-rendered dashboard UI (Jinja2 templates + static assets)."
State        = "Application state and startup/shutdown orchestration (AppState, HealthSnapshot)."
Events       = "Shared Lithos event subscription and browser fan-out over SSE (LensEvent, EventHub)."
LithosClient = "Lithos server clients — the real MCP-over-SSE client (health, registration, tool calls) plus the in-memory fake that backs fake-Lithos app mode."
Config       = "Configuration: the typed schema (dataclasses, defaults, ceilings) plus loading from lithos-lens.toml with env overrides."
Tasks        = "Tasks-dashboard data loading and normalization (task/claim/finding records + view models)."
TaskGraph    = "Task-graph transport records and normalizers (blocked-task rows + edges), plus the ready/blocked frontier join, the Needs-attention severity model, the dashboard assembly built on them, and the graph-native task-detail page with its bounded neighbour reads."
Knowledge    = "Knowledge-note rendering and normalization (safe server-side markdown, the related-panel neighborhood/view models, and the frontmatter metadata chips + lede)."
Logging      = "Structured JSON logging setup (JsonFormatter)."
Telemetry    = "Optional OpenTelemetry hooks and request middleware."
Errors       = "Exception hierarchy rooted at LithosLensError."

[components]
Entrypoint   = ["lithos_lens.main", "lithos_lens.__main__"]
Web          = ["lithos_lens.web"]
State        = ["lithos_lens.state"]
Events       = ["lithos_lens.events"]
LithosClient = ["lithos_lens.lithos_client", "lithos_lens.fake_lithos", "lithos_lens.fake_dataset"]
Config       = ["lithos_lens.config", "lithos_lens.config_fields", "lithos_lens.config_schema"]
Tasks        = ["lithos_lens.tasks", "lithos_lens.task_filtering", "lithos_lens.normalizers"]
TaskGraph    = ["lithos_lens.task_graph", "lithos_lens.frontier", "lithos_lens.frontier_fallback", "lithos_lens.frontier_join", "lithos_lens.epic_strip", "lithos_lens.attention", "lithos_lens.task_detail", "lithos_lens.task_links"]
Knowledge    = ["lithos_lens.knowledge", "lithos_lens.knowledge_metadata", "lithos_lens.knowledge_produced_by"]
Logging      = ["lithos_lens.logging"]
Telemetry    = ["lithos_lens.telemetry"]
Errors       = ["lithos_lens.errors"]

[tiers]
Entrypoints = ["Entrypoint", "Web"]
Core        = ["State", "Events", "LithosClient"]
Foundation  = ["Config", "Tasks", "TaskGraph", "Knowledge", "Logging", "Telemetry", "Errors"]

# Hard architecture budgets, checked by tests/guardrail/test_metrics_budgets.py
# against the metrics snapshot (docs/generated/metrics.md explains each one).
# CI fails if a measured value exceeds its budget. Raising a budget is allowed
# but must be an explicit, reviewed edit to this file; lower a budget after
# improving the code to lock in the gain.
#
# Most budgets below are tight ratchets pinned at today's value (any regression
# fails CI). max_module_lines is the exception: it is a STOP-LOSS ceiling set a
# little above today's largest module so a big module can't quietly balloon — it
# is deliberately NOT pinned to the exact current high-water mark. Ratchet the
# *count* of oversized modules down via modules_over_800_lines instead.
[budgets]
cross_component_edges  = 27   # +1 fake-mode event hub (fake_lithos -> events); +1 Web -> TaskGraph (frontier dashboard assembly); +1 Web -> Events (fake-mode publish seam constructs LensEvent); direction: down
component_cycles       = 0    # no component-level cycles today; keep it that way
module_cycles          = 0    # no module-level cycles today; keep it that way
# lithos_client is the ONE module allowed above the 800 god-module threshold.
# This PR raises its stop-loss 815 -> 895 for the transport hardening: the
# per-call deadline, the process-wide call gate, and the decoder's notes —
# that a whole-response size ceiling was considered and REJECTED (an
# input-domain restriction dressed as a bound, which would answer a runaway
# edge list with "blockers unavailable"), and that the parse holds the GIL, an
# accepted residual a thread pool was found not to fix. The raise bought
# bounds and the reasoning for them, not prose.
#
# The raise is granted against a TASK this time, not a promise in a comment:
# 8b8a5888-0ef1-4368-916c-d63fd34676f8 lifts the MCP transport (session worker,
# reconnect, call gate, tool-call decoding) out into its own module and hands
# the allowance back. Three consecutive raises have each been individually
# defensible; the cumulative 95 lines over threshold is why the extraction is
# now overdue rather than optional. No further raise should be spent here.
# web.py joined the over-800 set on the T1-S13 MERGE, not in either parent: #50
# added 85 lines to it and T1-S13 added 227, from 545 on the common base, and the
# sum crosses the line at 857. Neither PR breached the budget alone, so there was
# no point at which a reviewer could have been asked. Raised to 2 here so the
# decision is visible in the PR that causes it. 538e2f3d owns the remediation —
# extracting the request-filter plumbing, the growth driver on both sides — so
# this exception has an owner rather than a promise, the same way 8b8a5888 owns
# the lithos_client half. If both land, the count returns to 0 and the
# max_module_lines allowance can be given back.
modules_over_800_lines = 2    # lithos_client (888), web.py (857); no third may join
max_module_lines       = 895  # stop-loss, 7 lines over today's largest (888)
cross_module_private_refs = 0  # no cross-module private reaches today; keep it that way
tests_private_imports     = 0  # tests use only the public surface; keep it that way

# Domain class diagram: the task/event/health frozen dataclasses. The config
# (settings) dataclasses are configuration, not domain entities, so excluded.
# test_domain_model_diagram asserts EVERY public model's module is in include or
# exclude — a new model in an unlisted module fails until it is classified.
[domain]
include_modules = [
    "lithos_lens.tasks",
    "lithos_lens.task_detail",
    "lithos_lens.task_links",
    "lithos_lens.task_graph",
    "lithos_lens.knowledge",
    "lithos_lens.knowledge_metadata",
    "lithos_lens.knowledge_produced_by",
    "lithos_lens.events",
    "lithos_lens.state",
    "lithos_lens.lithos_client",
]
# fake_lithos holds fixture plumbing (FakeEventHub/FakeLithosClient) and
# fake_dataset its fixture bundle (FakeLithosDataset) — not domain entities.
# attention holds AttentionPolicy, which is threshold configuration (the same
# reason config is excluded); its domain model, AttentionReason, lives in
# lithos_lens.tasks and IS diagrammed.
exclude_modules = [
    "lithos_lens.attention",
    "lithos_lens.config",
    "lithos_lens.config_schema",
    "lithos_lens.errors",
    "lithos_lens.fake_lithos",
    "lithos_lens.fake_dataset",
]
